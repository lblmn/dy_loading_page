<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="icon" href="data:,">
<title>抖音作品</title>
<style>
  :root{color-scheme:dark}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0d0d0d;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  .page{width:100%;max-width:390px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{
    width:86px;height:86px;border-radius:20px;background:#12b76a;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:700;line-height:1;
  }
  h1{margin:28px 0 0;font-size:26px;font-weight:700;line-height:1.3}
  .desc{margin:14px 0 0;font-size:14px;line-height:1.6;color:#9b9b9b}
  .btn{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:50px;margin-top:32px;border:0;border-radius:8px;
    background:#1677ff;color:#fff;font-size:16px;font-weight:700;font-family:inherit;
    text-decoration:none;cursor:pointer;transition:background .15s,transform .1s;
  }
  .btn:active{background:#0f63d8;transform:scale(.995)}
  .btn[hidden]{display:none}

  /* 内置浏览器提示：仅当页面被微信等内置浏览器打开时出现 */
  .wechat-mask{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.82);z-index:50}
  .wechat-mask[hidden]{display:none}
  .wechat-box{width:min(100%,360px);padding:24px 22px;border-radius:14px;background:#161616;text-align:center}
  .wechat-box h2{margin:0 0 10px;font-size:17px;font-weight:700}
  .wechat-box p{margin:0 0 6px;color:#a3a3a3;font-size:13px;line-height:1.7;text-align:left}
  .wechat-box button{
    width:100%;height:44px;margin-top:10px;border:1px solid #2e2e2e;border-radius:8px;
    background:#1f1f1f;color:#fff;font-size:14px;font-family:inherit;cursor:pointer;
  }

  /* PC 端：内容区收窄，保持同样的视觉比例 */
  @media (min-width:768px){
    .page{max-width:360px}
    h1{font-size:24px}
  }
</style>
</head>
<body>
<main class="page">
  <div class="logo" id="logo" aria-hidden="true">音</div>
  <h1 id="title">抖音作品</h1>
  <p class="desc" id="subtitle">点击下面按钮打开抖音目标视频。</p>
  <a class="btn" id="launchBtn" href="#" hidden>打开目标视频</a>
</main>

<div class="wechat-mask" id="wechatMask" hidden>
  <div class="wechat-box">
    <h2>请在浏览器中打开</h2>
    <p>内置浏览器会拦截 App 深链。点击右上角「···」→「在浏览器中打开」，再访问本链接即可。</p>
    <button id="wechatCopy">复制本页链接</button>
    <button id="wechatTry">仍要尝试打开</button>
  </div>
</div>
<script src="/static/landing.js"></script>
</body>
</html>
