# LinkLab 反向代理示例（Nginx）
# 本服务不含 TLS，生产环境必须用它（或 Caddy）终止 HTTPS 后再转发。
# 把 server_name 改成客户自己的域名，证书路径改成实际路径。
# 对应 .env：LINKLAB_HOST=127.0.0.1（不要改成 0.0.0.0，容器/本机部署只让本机可访问即可）
#            LINKLAB_PUBLIC_BASE_URL=https://link.example.com
#            LINKLAB_SECURE_COOKIE=1
#            LINKLAB_TRUST_PROXY=1  （需要按真实 IP 做登录限流时才开）

server {
    listen 80;
    server_name link.example.com;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name link.example.com;

    ssl_certificate     /etc/letsencrypt/live/link.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传内容很小，按需调整
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "no-referrer" always;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        access_log off;
    }
}
